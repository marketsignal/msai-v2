name: Reap orphan NSG rules

# Exact owned completed attempts only. Creation uses the same recovery even
# when this supplementary schedule is disabled.
on:
  schedule:
    # Every 15 min off-the-mark. Skews from :00/:15/:30/:45 to spread API load.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: nsg-reaper
  cancel-in-progress: true

# Match the Ubuntu Debian az launcher while preloading in its own process.
env:
  MSAI_AZURE_CLI_PYTHON: /opt/az/bin/python3
  AZ_INSTALLER: DEB

jobs:
  reap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Reap proved completed owners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 control/scripts/nsg_rule_lifecycle.py reap \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --nsg-name "${{ vars.NSG_NAME }}" \
            --repository "${{ github.repository }}"
